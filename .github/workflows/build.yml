name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: Copy-Item target/release/monitor-aligner.exe MonitorAligner.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MonitorAligner
          path: MonitorAligner.exe

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))[^\n]*\n(.*?)(?=^## |\z)")
          $m.Groups[1].Value.Trim() | Out-File release-notes.md -Encoding utf8

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Monitor Aligner ${{ github.ref_name }}
          body_path: release-notes.md
          files: MonitorAligner.exe
